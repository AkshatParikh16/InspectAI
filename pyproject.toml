[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "InspectAI"
version = "0.1.0"
description = "Automated Adversarial Testing and Improvement Pipeline for AI Systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.2.0",
    "litellm>=1.55.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "duckdb>=1.2.0",
    "polars>=1.20.0",
    "langfuse>=2.56.0",
    "streamlit>=1.42.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "structlog>=24.0.0",
    "slowapi>=0.1.9",
]

[project.scripts]
InspectAI = "inspectai.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspectai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
