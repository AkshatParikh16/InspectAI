<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InspectAI - AI Quality Portal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-base:       #F4F6FA;
      --bg-surface:    #FFFFFF;
      --bg-elevated:   #F8FAFC;
      --bg-hover:      #F1F5F9;
      --border:        #E2E8F0;
      --border-bright: #CBD5E1;
      --pass:          #059669;
      --pass-dim:      rgba(5,150,105, 0.08);
      --fail:          #DC2626;
      --fail-dim:      rgba(220,38,38, 0.08);
      --warn:          #D97706;
      --warn-dim:      rgba(217,119,6, 0.08);
      --text-primary:  #0F172A;
      --text-secondary:#64748B;
      --text-dim:      #94A3B8;
      --accent:        #4F46E5;
      --accent-light:  #6366F1;
      --accent-dim:    rgba(79,70,229, 0.08);
      --sidebar-width: 240px;
      --topbar-height: 56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Do NOT set overflow:hidden on html/body — landing page needs to scroll */
    html { min-height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    /* #root height is managed by app.jsx per-view (landing = auto, portal = 100vh) */
    #root { min-height: 100vh; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

    .mono { font-family: 'JetBrains Mono', monospace; }

    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }

    input, select, textarea {
      font-family: inherit;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }
    input[type="range"] { padding: 0; border: none; box-shadow: none; background: transparent; }

    .grid { display: grid; gap: 16px; }
    .g-4 { grid-template-columns: repeat(4, 1fr); }
    .g-3 { grid-template-columns: repeat(3, 1fr); }
    .g-2 { grid-template-columns: 1fr 1fr; }
    .g-sidebar { grid-template-columns: 1fr 340px; }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }

    @media (max-width: 1200px) {
      .g-4 { grid-template-columns: repeat(2, 1fr); }
      .g-3 { grid-template-columns: 1fr 1fr; }
      .span-3 { grid-column: span 2; }
      .g-sidebar { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .g-4, .g-3, .g-2 { grid-template-columns: 1fr; }
      .span-2, .span-3 { grid-column: 1; }
      .sidebar-label { display: none; }
      .app-sidebar { width: 64px !important; min-width: 64px !important; }
      .page-scroll { padding: 16px !important; }
    }

    /* Portal page container — full height scrollable region */
    .page-scroll { flex: 1; overflow: auto; padding: 28px 32px; }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .table-wrap { overflow-x: auto; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="./api.js"></script>
  <script src="./mockData.js"></script>

  <script type="text/babel" src="./components/shared.jsx"></script>
  <script type="text/babel" src="./components/Login.jsx"></script>
  <script type="text/babel" src="./components/Landing.jsx"></script>
  <script type="text/babel" src="./components/TopBar.jsx"></script>
  <script type="text/babel" src="./components/Sidebar.jsx"></script>
  <script type="text/babel" src="./components/Dashboard.jsx"></script>
  <script type="text/babel" src="./components/Issues.jsx"></script>
  <script type="text/babel" src="./components/Remediation.jsx"></script>
  <script type="text/babel" src="./components/Reports.jsx"></script>
  <script type="text/babel" src="./components/Settings.jsx"></script>
  <script type="text/babel" src="./components/Scenarios.jsx"></script>
  <script type="text/babel" src="./components/Integration.jsx"></script>
  <script type="text/babel" src="./app.jsx"></script>
</body>
</html>
